name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/phantomgrid.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/docs >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phantomgrid.log
          exit 1
      - name: Run integration tests
        run: python -m pytest tests/ -v
