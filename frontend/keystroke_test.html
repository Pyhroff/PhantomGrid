<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keystroke Timing Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 40px; }
  h1 { font-size: 18px; color: #7c6aff; margin-bottom: 6px; }
  p.sub { font-size: 12px; color: #666; margin-bottom: 24px; }
  input#typing-field {
    width: 100%; padding: 12px 16px; font-size: 16px; font-family: monospace;
    background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
    color: #fff; outline: none; margin-bottom: 24px;
  }
  input#typing-field:focus { border-color: #7c6aff; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat-box { flex: 1; background: #1a1a1a; border: 1px solid #222; border-radius: 8px; padding: 12px 16px; }
  .stat-label { font-size: 11px; color: #666; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: bold; color: #7c6aff; }

  /* FIX: both header and rows use the exact same grid definition */
  .log-grid { display: grid; grid-template-columns: 80px 160px 160px 140px; gap: 0; }

  .log-header { margin-bottom: 6px; padding: 6px 12px; background: #1a1a1a; border-radius: 6px; }
  .log-header span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; }

  #log { max-height: 280px; overflow-y: auto; }
  .log-row { padding: 7px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 2px; background: #141414; }
  .log-row:nth-child(even) { background: #1a1a1a; }

  .key-name { color: #fff; font-weight: bold; }
  .dwell { color: #4ecdc4; }
  .interval { color: #ffd93d; }
  .flag { color: #ff6b6b; font-size: 11px; }
  .flag.ok { color: #6bcb77; }

  #clear-btn { margin-top: 16px; background: none; border: 1px solid #333; color: #666;
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 12px; }
  #clear-btn:hover { border-color: #666; color: #aaa; }
</style>
</head>
<body>

<h1>⌨ Keystroke Timing Capture</h1>
<p class="sub">Type anything below. Every key's dwell time and inter-key interval will be logged.</p>

<input type="text" id="typing-field" placeholder="Start typing here..." autocomplete="off" spellcheck="false">

<div class="stats">
  <div class="stat-box">
    <div class="stat-label">Average dwell time</div>
    <div class="stat-value" id="avg-dwell">— ms</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Average interval (IKI)</div>
    <div class="stat-value" id="avg-iki">— ms</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Keys logged</div>
    <div class="stat-value" id="key-count">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Suspicious pauses (&gt;500ms)</div>
    <div class="stat-value" id="pause-count" style="color:#ff6b6b">0</div>
  </div>
</div>

<!-- Header row -->
<div class="log-grid log-header">
  <span>Key</span>
  <span>Dwell time</span>
  <span>Interval (IKI)</span>
  <span>Flag</span>
</div>

<!-- Log rows go here -->
<div id="log"></div>

<button id="clear-btn" onclick="clearLog()">Clear log</button>

<script>
  let keyDownTimes = {};
  let lastKeyUpTime = null;
  let dwellTimes = [];
  let intervals = [];
  let pauseCount = 0;

  const field    = document.getElementById('typing-field');
  const log      = document.getElementById('log');
  const avgDwell = document.getElementById('avg-dwell');
  const avgIki   = document.getElementById('avg-iki');
  const keyCount = document.getElementById('key-count');
  const pauseEl  = document.getElementById('pause-count');

  field.addEventListener('keydown', function(e) {
    if (!keyDownTimes[e.code]) {
      keyDownTimes[e.code] = performance.now();
    }
  });

  field.addEventListener('keyup', function(e) {
    const keyUpTime = performance.now();
    const keyDownTime = keyDownTimes[e.code];
    if (!keyDownTime) return;

    const dwell = Math.round(keyUpTime - keyDownTime);

    let iki = null;
    if (lastKeyUpTime !== null) {
      iki = Math.round(keyDownTime - lastKeyUpTime);
    }

    delete keyDownTimes[e.code];
    lastKeyUpTime = keyUpTime;
    dwellTimes.push(dwell);
    if (iki !== null) intervals.push(iki);

    let flagText = '—';
    let flagClass = 'ok';
    if (iki !== null && iki > 500) {
      pauseCount++;
      flagText = '⚠ long pause';
      flagClass = '';
      pauseEl.textContent = pauseCount;
    } else if (iki !== null && iki < 30) {
      flagText = '⚡ fast';
      flagClass = 'ok';
    }

    // Each row uses the same log-grid class so columns line up with header
    const row = document.createElement('div');
    row.className = 'log-grid log-row';
    row.innerHTML = `
      <span class="key-name">${e.key === ' ' ? 'SPACE' : e.key}</span>
      <span class="dwell">${dwell} ms</span>
      <span class="interval">${iki !== null ? iki + ' ms' : '—'}</span>
      <span class="flag ${flagClass}">${flagText}</span>
    `;
    log.prepend(row);

    const ad = Math.round(dwellTimes.reduce((a,b) => a+b, 0) / dwellTimes.length);
    avgDwell.textContent = ad + ' ms';
    keyCount.textContent = dwellTimes.length;
    if (intervals.length > 0) {
      const ai = Math.round(intervals.reduce((a,b) => a+b, 0) / intervals.length);
      avgIki.textContent = ai + ' ms';
    }
  });

  function clearLog() {
    log.innerHTML = '';
    dwellTimes = []; intervals = [];
    lastKeyUpTime = null; keyDownTimes = {};
    pauseCount = 0;
    avgDwell.textContent = '— ms';
    avgIki.textContent = '— ms';
    keyCount.textContent = '0';
    pauseEl.textContent = '0';
  }
</script>

</body>
</html>
